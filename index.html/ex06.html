<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício 6</title>
</head>
<body>
    <h1>Positivo, Negativo ou Zero</h1>

    <script>
        var numero

        numero = parseInt(prompt("Informe um número: "))

        if (numero > 0) {
            alert("O número " + numero + " é positivo.")
        } else if (numero < 0) {
            alert("O número " + numero + " é negativo.")
        } else {
            alert("O número é igual a zero.")
        }

    </script>

</body>
</html>
