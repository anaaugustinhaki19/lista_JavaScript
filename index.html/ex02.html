<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício 2</title>
</head>
<body>
    <h1>Quatro Operações</h1>

    <script>
        var n1, n2, soma, subtracao, multiplicacao, divisao

        n1 = parseInt(prompt("Informe o primeiro número: "))
        n2 = parseInt(prompt("Informe o segundo número: "))

        soma = n1 + n2
        subtracao = n1 - n2
        multiplicacao = n1 * n2
        divisao = n1 / n2

        alert("Resultados:\n" +
              "a) Soma: " + soma + "\n" +
              "b) Subtração: " + subtracao + "\n" +
              "c) Multiplicação: " + multiplicacao + "\n" +
              "d) Divisão: " + divisao)
    </script>
    
</body>
</html>
