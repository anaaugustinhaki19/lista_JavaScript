<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício 17</title>
</head>
<body>
    <h1>Calculadora de IMC</h1>

    <script>
        var peso, altura, imc

        peso = parseFloat(prompt("Informe o seu peso em kg (ex: 60.3): "))
        altura = parseFloat(prompt("Informe a sua altura em metros (ex: 1.65): "))

        imc = peso / (altura * altura)

        if (imc < 18.5) {
            alert("Seu IMC é: " + imc + "\nClassificação: Abaixo do peso")
        } else if (imc >= 18.5 && imc <= 24.9) {
            alert("Seu IMC é: " + imc + "\nClassificação: Peso adequado")
        } else if (imc >= 25 && imc <= 29.9) {
            alert("Seu IMC é: " + imc + "\nClassificação: Sobrepeso")
        } else {
            alert("Seu IMC é: " + imc + "\nClassificação: Obesidade")
        }

    </script>


</body>
</html>
