<body>
    <h1>Maior de Idade</h1>

    <script>
        var idade

        idade = parseInt(prompt("Informe a sua idade: "))

        if (idade >= 18) {
            alert("Você é maior de idade.")
        } else {
            alert("Você é menor de idade.")
        }

    </script>
