<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício 3</title>
</head>
<body>
    <h1>Média de Notas</h1>

    <script>
        var n1, n2, n3, media

        n1 = parseInt(prompt("Informe a primeira nota: "))
        n2 = parseInt(prompt("Informe a segunda nota: "))
        n3 = parseInt(prompt("Informe a terceira nota: "))

        media = (n1 + n2 + n3) / 3

        alert("A média final do aluno eh: " + media)
    </script>

</body>
</html>
