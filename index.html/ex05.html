<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício 5</title>
</head>
<body>
    <h1>Conversão de Temperatura</h1>

    <script>
        var celsius, fahrenheit

        celsius = parseInt(prompt("Informe a temperatura em Celsius (°C): "))

        fahrenheit = (celsius * 9 / 5) + 32

        alert(celsius + "°C equivalem a " + fahrenheit + "°F")
    </script>

</body>
</html>
