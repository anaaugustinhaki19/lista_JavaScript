<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício 8</title>
</head>
<body>
    <h1>Par ou Ímpar</h1>

    <script>
        var numero

        numero = parseInt(prompt("Informe um número inteiro: "))

        if (numero % 2 == 0) {
            alert("O número " + numero + " é PAR.")
        } else {
            alert("O número " + numero + " é IMPAR.")
        }

    </script>

</body>
</html>
