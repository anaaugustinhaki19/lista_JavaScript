<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício 15</title>
</head>
<body>
    <h1>Cardápio</h1>

    <script>
        var op, qtd, unitario, total

        op = parseInt(prompt("CARDÁPIO: \n1 - Hambúrguer - R$ 15,00\n2 - Cachorro-quente - R$ 12,00\n3 - Pizza - R$ 20,00\n4 - Refrigerante - R$ 6,00\n\nDigite o número do produto desejado:"))

        switch (op) {
            case 1:
                unitario = 15
                break
            case 2:
                unitario = 12
                break
            case 3:
                unitario = 20
                break
            case 4:
                unitario = 6
                break
            default:
                unitario = 0
                break
        }

        if (unitario > 0) {
            qtd = parseInt(prompt("Informe a quantidade desejada:"))
            total = unitario * qtd
            alert("Valor total da compra: R$ " + total + ",00")
        } else {
            alert("Produto inválido")
        }
    </script>
</body>
</html>
