<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício 1</title>
</head>
<body>
    <h1>Antecessor e Sucessor</h1>

    <script>
        var numero, antecessor, sucessor

        numero = parseInt(prompt("Digite um número: "))

        antecessor = numero - 1
        sucessor = numero + 1

        alert("Número digitado: " + numero + "\nAntecessor: " + antecessor + "\nSucessor: " + sucessor)
        
    </script>
    
</body>
</html>
