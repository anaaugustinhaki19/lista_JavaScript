<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Exercício 4</title>
</head>
<body>
    <h1>Área do Retângulo</h1>

    <script>
        var largura, altura, area

        largura = parseInt(prompt("Informe a largura do retângulo: "))
        altura = parseInt(prompt("Infome a altura do retângulo: "))

        area = largura * altura

        alert("A área do retângulo eh: " + area)
    </script>

</body>
</html>
